<script>

/* ===== core: statistiques, plans de test, analyse (fonctions pures) ===== */
const Z95 = 1.959964;
const _lf = [0];
function logFact(n){ while (_lf.length <= n) _lf.push(_lf[_lf.length - 1] + Math.log(_lf.length)); return _lf[n]; }
function logChoose(n, k){ return logFact(n) - logFact(k) - logFact(n - k); }
function binomPmf(k, n, p){
  if (k < 0 || k > n) return 0;
  if (p <= 0) return k === 0 ? 1 : 0;
  if (p >= 1) return k === n ? 1 : 0;
  return Math.exp(logChoose(n, k) + k * Math.log(p) + (n - k) * Math.log(1 - p));
}
function binomUpper(k, n, p){ if (k <= 0) return 1; if (k > n) return 0; let s = 0; for (let i = k; i <= n; i++) s += binomPmf(i, n, p); return Math.min(1, s); }
function binomTwoSided(k, n, p){
  if (n === 0) return 1;
  const pk = binomPmf(k, n, p); let s = 0;
  for (let i = 0; i <= n; i++){ const q = binomPmf(i, n, p); if (q <= pk * (1 + 1e-9)) s += q; }
  return Math.min(1, s);
}
function wilson(k, n){
  if (!n) return [0, 1];
  const z = Z95, p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d;
  const h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d;
  return [Math.max(0, c - h), Math.min(1, c + h)];
}
function fisher(a, b, c, d){
  const r1 = a + b, r2 = c + d, c1 = a + c, n = r1 + r2;
  if (!r1 || !r2) return 1;
  const lo = Math.max(0, c1 - r2), hi = Math.min(r1, c1);
  const lp = x => logChoose(r1, x) + logChoose(r2, c1 - x) - logChoose(n, c1);
  const p0 = Math.exp(lp(a)); let s = 0;
  for (let x = lo; x <= hi; x++){ const q = Math.exp(lp(x)); if (q <= p0 * (1 + 1e-9)) s += q; }
  return Math.min(1, s);
}
function critK(n, p0, alpha){ let s = 0; for (let k = n; k >= 0; k--){ s += binomPmf(k, n, p0); if (s > alpha) return k + 1; } return 0; }
function sampleSize(p0, p1, alpha, power, nmax){
  nmax = nmax || 400;
  const pw = [];
  for (let n = 5; n <= nmax; n++) pw[n] = binomUpper(critK(n, p0, alpha), n, p1);
  for (let n = 5; n <= nmax - 10; n++){
    let ok = true;
    for (let m = n; m <= n + 10; m++) if (pw[m] < power){ ok = false; break; }
    if (ok) return n;
  }
  return null;
}
function tCrit95(df){
  if (df < 1) return NaN;
  const z = Z95, z3 = z ** 3, z5 = z ** 5, z7 = z ** 7;
  return z + (z3 + z) / (4 * df) + (5 * z5 + 16 * z3 + 3 * z) / (96 * df ** 2) + (3 * z7 + 19 * z5 + 17 * z3 - 15 * z) / (384 * df ** 3);
}
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
function sd(a){ if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); }
function quantile(a, q){
  if (!a.length) return null;
  const s = a.slice().sort((x, y) => x - y), pos = (s.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
  return s[lo] + (s[hi] - s[lo]) * (pos - lo);
}

/* --- aléa reproductible pour équilibrer les plans --- */
function xmur3(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return function(){ h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; };
}
function mulberry32(a){
  return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function rngFrom(str){ return mulberry32(xmur3(str)()); }
function shuffleSeeded(arr, seed){
  const r = rngFrom(seed), a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function rand01(){
  if (typeof crypto !== 'undefined' && crypto.getRandomValues){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }
  return Math.random();
}
const COLORS = ['vert', 'jaune', 'rouge', 'orange', 'bleu'];
function distinctCodes(n){
  const a = COLORS.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rand01() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a.slice(0, n);
}

/* --- libellés --- */
const SEGS = [
  ['sommelier', 'Sommelier, professionnel du vin'],
  ['expert', 'Expert (caviste, œnologue, critique)'],
  ['enthusiast', 'Amateur passionné'],
  ['consumer', 'Consommateur occasionnel'],
  ['non', "Ne boit pas ou n'aime pas le vin"]
];
const WINE_TYPES = ['Rouge', 'Blanc', 'Rosé', 'Effervescent', 'Autre'];
const AGES = ['18-24', '25-34', '35-49', '50-64', '65+'];
const FREQS = [['rare', 'Jamais ou rarement'], ['occasional', '1 à 3 fois par mois'], ['weekly', 'Chaque semaine'], ['frequent', 'Presque tous les jours']];
const CONF = [['guess', 'Je devine'], ['fairly', 'Plutôt sûr·e'], ['sure', 'Très sûr·e']];
const STRENGTH = [['slight', 'Légèrement'], ['clear', 'Nettement'], ['strong', 'Beaucoup']];
const DIFFQ = [['clear', 'Oui, nettement'], ['slight', 'Oui, légèrement'], ['none', 'Je n’en perçois aucune']];
const REUSE = [['sure', 'Oui, sûrement'], ['probably', 'Probablement'], ['unlikely', 'Probablement pas'], ['no', 'Non']];
const GIFT = [['yes', 'Oui'], ['maybe', 'Peut-être'], ['no', 'Non']];
const ATTRS = [
  ['attaque', 'Attaque en bouche'], ['texture', 'Texture, rondeur'], ['tanins', 'Tanins, astringence'],
  ['acidite', 'Acidité, fraîcheur'], ['aromes', 'Arômes'], ['longueur', 'Longueur en bouche'],
  ['equilibre', 'Équilibre global'], ['douceur', 'Douceur, moins d’agressivité'], ['alcool', 'Chaleur, alcool'], ['visuel', 'Aspect visuel'],
  ['autre', 'Autre'], ['nsp', 'Je ne sais pas dire']
];
const lab = (list, k) => { const f = list.find(x => x[0] === k); return f ? f[1] : (k == null ? '' : k); };

/* --- plan de test --- */
const TRI_DESIGNS = ['TTU', 'TUT', 'UTT', 'UUT', 'UTU', 'TUU'];
function oddIndex(s){
  const t = [...s].filter(c => c === 'T').length;
  return s.indexOf(t === 1 ? 'T' : 'U');
}
function makeAssignment(existing, cfg){
  const key = 'tg|' + cfg.session, k = existing.length;
  let arm = 'test';
  if (cfg.share > 0){
    const bs = cfg.share;
    const blk = shuffleSeeded(['C'].concat(Array(bs - 1).fill('T')), key + '|arm|' + Math.floor(k / bs));
    arm = blk[k % bs] === 'C' ? 'control' : 'test';
  }
  const m = existing.filter(r => r.arm === arm).length;

function demoRecords(){
  const r = rngFrom('demo-two-glass-v1'), out = [];
  const pick = list => { let x = r(), s = 0; for (const [v, w] of list){ s += w; if (x <= s) return v; } return list[list.length - 1][0]; };
  const pdBySeg = { sommelier: 0.34, expert: 0.30, enthusiast: 0.26, consumer: 0.20, non: 0.14 };
  for (let i = 0; i < 70; i++){
    const arm = i % 5 === 4 ? 'control' : 'test';
    const seg = pick([['sommelier', .1], ['expert', .12], ['enthusiast', .26], ['consumer', .3], ['non', .22]]);
    const type = pick([['Rouge', .45], ['Blanc', .35], ['Rosé', .1], ['Effervescent', .1]]);
    const samples = TRI_DESIGNS[i % 6], odd = oddIndex(samples);
    const pc = arm === 'test' ? 1 / 3 + (2 / 3) * pdBySeg[seg] : 1 / 3;
    const ok = r() < pc;
    const others = [0, 1, 2].filter(x => x !== odd);
    const pickTri = ok ? odd : others[Math.floor(r() * 2)];
    const ps = i % 2 ? 'TU' : 'UT';
    const likesT = r() < (arm === 'test' ? 0.62 : 0.5);
    const iT = ps.indexOf('T'), iU = ps.indexOf('U');
    const pickPref = likesT ? iT : iU;
    const base = 3.6 + r() * 1.8, bonus = arm === 'test' ? 0.45 : 0;
    const sT = Math.max(1, Math.min(7, Math.round(base + bonus + (r() - .5) * 1.6)));

    const scores = [null, null]; scores[iT] = sT; scores[iU] = sU;
    const x = r();
    const diff = arm === 'test' ? (x < .32 ? 'clear' : x < .66 ? 'slight' : 'none') : (x < .08 ? 'clear' : x < .33 ? 'slight' : 'none');
    const attrs = []; if (ok){ ['texture', 'attaque', 'aromes', 'acidite', 'equilibre', 'longueur', 'tanins'].forEach(a => { if (r() < .28) attrs.push(a); }); if (r() < .06) attrs.push('visuel'); if (!attrs.length) attrs.push('nsp'); }
    const rec = {
      id: 'demo' + i, demo: true, session: 'Exemple simulé', pid: 'P' + String(i + 1).padStart(2, '0'), round: 1, status: 'complete',
      createdAt: '2026-10-08T18:00:00.000Z', completedAt: '2026-10-08T18:' + String(10 + (i % 50)).padStart(2, '0') + ':00.000Z',
      arm, wine: { name: 'Vin exemple ' + (1 + (i % 3)), type },
      profile: { seg, age: AGES[Math.floor(r() * 5)], freq: 'occasional', like: seg === 'non' ? 1 + Math.floor(r() * 2) : 3 + Math.floor(r() * 3) },
      tri: { samples, codes: ['vert', 'rouge', 'bleu'], odd, pick: pickTri, conf: ok ? 'fairly' : 'guess', attrs },
      pref: { samples: ps, codes: ['jaune', 'orange'], pick: pickPref, strength: 'clear', scores, diff, soft: (r() < (arm === 'test' ? 0.64 : 0.5)) ? iT : iU }, duration: 240
    };
    if (arm === 'test'){
      const y = r();
      rec.post = {
        reuse: y < .26 ? 'sure' : y < .62 ? 'probably' : y < .86 ? 'unlikely' : 'no',
        wtp: Math.max(0, Math.round(Math.exp(Math.log(32) + (r() - .5) * 1.5) / 5) * 5),

}

        <div class="field"><span class="lbl">${T.pf_like}</span>${scale('pf', 'data-k="like"', 5, r.profile.like)}<div class="ends"><span>${T.lo5}</span><span>${T.hi5}</span></div></div>
        ${next()}`;
      break;
    case 'tri':
      body = `<div><h1>${T.t_h}</h1><p style="margin-top:8px">${T.t_p}</p><p class="hint">${T.t_hint}</p></div>
        ${glasses(T, r.tri.codes, r.tri.pick, 'triPick')}
        ${r.tri.pick != null ? `<div class="field"><span class="lbl">${T.t_conf}</span>${chipsFor('conf', 'conf', olist(T, 'conf', CONF.map(x => x[0])), r.tri.conf)}</div>
        <div class="field"><span class="lbl">${T.t_attr} ${opt}</span><div class="chips" role="group">${ATTRS.map(([k]) => chip(`data-act="attr" data-v="${k}"`, T.o.attr[k], r.tri.attrs.includes(k))).join('')}</div></div>` : ''}
        ${next(T.t_b)}`;
      break;
    case 'wait2':
      body = `<h1>${T.x_h}</h1>
        <p>${T.x_p}</p>
        <button type="button" class="btn lg" data-act="next">${T.x_b}</button>`;
      break;
    case 'pref':
      body = `<div><h1>${T.p_h}</h1><p style="margin-top:8px">${T.p_p}</p><p class="hint">${T.p_hint}</p></div>
        ${glasses(T, r.pref.codes, r.pref.pick, 'prefPick')}
        ${r.pref.pick != null ? `
        <div class="field"><span class="lbl">${T.p_str}</span>${chipsFor('strength', 'strength', olist(T, 'strength', STRENGTH.map(x => x[0])), r.pref.strength)}</div>
        ${[0, 1].map(k => `<div class="field"><span class="lbl">${T.p_note(nm(r.pref.codes[k], r.lang))}</span>${scale('score', 'data-i="' + k + '"', 7, r.pref.scores[k])}<div class="ends"><span>${T.p_lo}</span><span>${T.p_hi}</span></div></div>`).join('')}
        <div class="field"><span class="lbl">${T.p_diff}</span>${chipsFor('diff', 'diff', olist(T, 'diff', DIFFQ.map(x => x[0])), r.pref.diff)}</div>
        <div class="field"><span class="lbl">${T.p_soft}</span><div class="chips" role="group">${r.pref.codes.map((c, k) => `<button type="button" class="chip" data-act="soft" data-v="${k}" aria-pressed="${r.pref.soft === k}">${dot(c, 'xs')}${esc(T.col[c])}</button>`).join('')}</div><p class="hint">${T.p_softhint}</p></div>` : ''}
        ${next(T.p_b)}`;
      break;
    case 'reveal': {
      if (r.arm === 'control'){
        body = `<h1>${T.c_h}</h1>
          <p>${T.c_p1}</p>
          <p>${T.c_p2}</p>
          <button type="button" class="btn lg" data-act="next">${T.cont}</button>`;
      } else {
        const tr = r.tri, pf = r.pref, odd = T.col[tr.codes[tr.odd]], found = tr.pick === tr.odd;
        const pT = T.col[pf.codes[pf.samples.indexOf('T')]], liked = prefPickedT(r);
        body = `<h1>${T.r_h}</h1>
          <div class="field"><h3>${T.r_1}</h3>
            <div class="revtbl">${tr.codes.map((c, k) => `<div class="rev">${dot(c, 'sm')}<b>${esc(T.col[c])}</b>${tr.samples[k] === 'T' ? `<span class="tag t">${T.r_with}</span>` : `<span class="tag u">${T.r_without}</span>`}${k === tr.pick ? `<span class="sub">${T.r_yours}</span>` : ''}</div>`).join('')}</div>
            <p>${T.r_odd(odd, found)}</p></div>
          <div class="field"><h3>${T.r_2}</h3>
            <p>${T.r_pref(pT, liked)}</p></div>
          <button type="button" class="btn lg" data-act="next">${T.r_b}</button>`;
      }
      break;
    }
    case 'post':
      body = `<h1>${T.o_h}</h1>
        <div class="field"><span class="lbl">${T.o_reuse}</span>${chipsFor('reuse', 'reuse', olist(T, 'reuse', REUSE.map(x => x[0])), r.post.reuse)}</div>
        <div class="field"><label for="f-wtp">${T.o_wtp(cs)}</label>
          <input id="f-wtp" type="number" inputmode="decimal" min="0" step="1" data-bind="run.rec.post.wtp" value="${r.post.wtp == null ? '' : r.post.wtp}" placeholder="${T.o_wtp_ph}"></div>
        <div class="field"><span class="lbl">${T.o_gift}</span>${chipsFor('gift', 'gift', olist(T, 'gift', GIFT.map(x => x[0])), r.post.gift)}</div>
        <div class="field"><span class="lbl">${T.o_cur}</span>${scale('curious', '', 5, r.post.curious)}<div class="ends"><span>${T.lo5}</span><span>${T.hi5}</span></div></div>
        <div class="field"><label for="f-com">${T.o_com} ${opt}</label><textarea id="f-com" data-bind="run.rec.post.comment">${esc(r.post.comment || '')}</textarea></div>
        ${next()}`;
      break;
    case 'contact': {
      const em = (R.email || '').trim(), bad = em && !EMAIL_RE.test(em);
      body = `<h1>${T.k_h}</h1>
        <p>${T.k_p}</p>
        <div class="field"><label for="f-mail">${T.k_mail} ${opt}</label>
          <input id="f-mail" type="email" inputmode="email" autocomplete="email" data-bind="run.email" value="${esc(R.email || '')}" placeholder="name@example.com"></div>
        <div class="field"><button type="button" class="chip" data-act="consent" aria-pressed="${R.consent ? 'true' : 'false'}" style="border-radius:14px;text-align:left;line-height:1.4;padding:10px 14px">${R.consent ? '☑' : '☐'} ${esc(T.k_cons(S.cfg.org || 'Wine Optimizer'))}</button></div>
        <p class="err" id="k-msg" role="alert" ${bad ? '' : 'hidden'}>${T.k_bad}</p>
        <p class="hint" id="k-need" ${(em && !bad && !R.consent) ? '' : 'hidden'}>${T.k_need}</p>
        ${next(T.k_b)}`;
      break;
    }
    case 'thanks':
      body = `<h1>${R.already ? T.already : T.th_h}</h1>
        <p>${T.th_p}</p>`;
      break;
  }
  const errBox = R.error ? `<div class="banner alert" role="alert">${esc(R.error)}</div>` : '';
  return `${head}<main class="wrap" lang="${HTML_LANG[r.lang] || 'fr'}"><section class="card pmain">${body}${errBox}</section></main>`;
}



/* ---------- actions ---------- */
const uid = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.floor(rand01() * 16); return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const TESTER = (() => { try { const t = new URLSearchParams(location.search).get('t'); return t && UUID_RE.test(t) ? t.toLowerCase() : null; } catch (e) { return null; } })();
const testerUrl = id => (CFG.publicUrl ? CFG.publicUrl.replace(/\/+$/, '/') : location.origin + location.pathname) + '?t=' + id;
let WATCH = null;

async function prepare(){
  const c = S.cfg;
  if (!c.session.trim() || !c.wineName.trim()){ S.err = 'Renseignez la session et le vin dégusté.'; return render(); }
  if (c.pidMode === 'existing' && !c.pid){ S.err = 'Aucun participant à reprendre : choisissez « Nouveau participant ».'; return render(); }
  S.err = '';
  const inS = sessionRecs(), a = makeAssignment(inS, { session: c.session.trim(), share: c.share });
  let pid, round = 1, profile = { seg: null, age: null, freq: null, like: null }, needProfile = true;
  if (c.pidMode === 'existing'){
    pid = c.pid; const prev = inS.filter(r => r.pid === pid);
    round = prev.length + 1;
    const last = prev.filter(r => r.profile && r.profile.seg).pop();
    if (last){ profile = Object.assign({}, last.profile); needProfile = false; }
  } else pid = nextPid(inS);
  const rec = {
    id: uid(), session: c.session.trim(), pid, round, status: 'assigned', createdAt: new Date().toISOString(),
    lang: c.lang, cur: c.cur, org: c.org, arm: a.arm, wine: { name: c.wineName.trim(), type: c.wineType }, profile, tri: a.tri, pref: a.pref,
    post: a.arm === 'test' ? { cur: c.cur, reuse: null, wtp: null, gift: null, curious: null, comment: '' } : null
  };
  S.run = { rec, step: 'prep', needProfile };
  render(); window.scrollTo(0, 0);
}
async function readyRun(){
  const R = S.run; if (!R || S.busy) return;
  S.busy = true; render();
  try { await store.put(R.rec); R.step = 'qr'; R.status = 'assigned'; startWatch(); }
  catch (e) { toast('Enregistrement impossible : ' + e.message); }
  S.busy = false; render(); window.scrollTo(0, 0);
}
function startWatch(){
  clearInterval(WATCH);
  WATCH = setInterval(async () => {
    const R = S.run;
    if (!R || R.step !== 'qr'){ clearInterval(WATCH); return; }
    try {
      const rows = await API.select('tastings', 'select=status&id=eq.' + R.rec.id);
      const st = rows[0] ? rows[0].status : null;
      if (st && st !== R.status){ R.status = st; if (st === 'complete') store.pull(true); render(); }
    } catch (e) {}
  }, 3000);
}
function download(fn, text){
  const b = new Blob([text], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = fn; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Fichier téléchargé');
}
function exportCsv(){ download('two-glass-test_' + new Date().toISOString().slice(0, 10) + '.csv', toCsv(S.records.slice().sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || '')))); }
function exportContacts(){ download('two-glass-contacts_' + new Date().toISOString().slice(0, 10) + '.csv', toContactsCsv(S.contacts)); }
async function doLogin(){
  const e = ($('#f-email').value || '').trim(), p = $('#f-pw').value || '';
  S.loginEmail = e; S.busy = true; S.loginErr = ''; render();
  try {
    await API.login(e, p);
    const ok = await API.rpc('is_staff');
    if (ok !== true){ API.logout(); throw new Error('Ce compte n’est pas autorisé. Ajoutez son adresse dans la table « staff » (voir le mode d’emploi).'); }
    S.auth = API.auth; S.busy = false; render(); store.init(); return;
  } catch (err) { S.auth = null; S.loginErr = /invalid|credentials/i.test(err.message) ? 'E-mail ou mot de passe incorrect.' : err.message; }
  S.busy = false; render();
}
const wipe = () => { clearInterval(WATCH); store.timer && clearInterval(store.timer); };

/* ---------- parcours du testeur sur son téléphone ---------- */
function applyReveal(rec, v){
  rec.arm = v.arm; rec.tri.samples = v.triSamples; rec.tri.odd = v.odd; rec.pref.samples = v.prefSamples;
  if (v.triPick != null) rec.tri.pick = v.triPick;
  if (v.prefPick != null) rec.pref.pick = v.prefPick;
}
async function loadTester(){
  S.tstate = 'loading'; S.run = null; render();
  try {
    const g = await API.rpc('tester_get', { p_id: TESTER });
    if (!g){ S.tstate = 'notfound'; return render(); }
    const rec = {
      id: TESTER, lang: LANGS.some(l => l[0] === g.lang) ? g.lang : 'fr', cur: g.cur, org: g.org, arm: null, wine: {},
      profile: { seg: null, age: null, freq: null, like: null },
      tri: { codes: g.triCodes, pick: null, conf: null, attrs: [] },
      pref: { codes: g.prefCodes, pick: null, strength: null, scores: [null, null], diff: null, soft: null },
      post: { cur: g.cur, reuse: null, wtp: null, gift: null, curious: null, comment: '' }
    };
    S.run = { rec, step: 'welcome', needProfile: g.needProfile, t0: Date.now() };
    if (g.status === 'tri_done') S.run.step = 'wait2';
    else if (g.status === 'pref_done'){ applyReveal(rec, g.reveal); S.run.step = 'reveal'; }
    else if (g.status === 'complete'){ S.run.step = 'thanks'; S.run.already = true; }
    S.tstate = 'ok';
  } catch (e) { S.tstate = 'err'; S.terr = e.message; }
  render();
}
async function testerNext(){
  const R = S.run, r = R.rec; if (R.busy) return;
  const steps = stepsFor(R), nextStep = steps[steps.indexOf(R.step) + 1];
  R.busy = true; R.error = ''; render();
  try {
    if (R.step === 'tri') await API.rpc('tester_submit', { p_id: TESTER, p_stage: 'tri', p_data: { profile: R.needProfile ? r.profile : null, pick: r.tri.pick, conf: r.tri.conf, attrs: r.tri.attrs } });
    else if (R.step === 'pref'){
      const v = await API.rpc('tester_submit', { p_id: TESTER, p_stage: 'pref', p_data: { pick: r.pref.pick, strength: r.pref.strength, scores: r.pref.scores, diff: r.pref.diff, soft: r.pref.soft } });
      applyReveal(r, v);
    } else if (R.step === 'contact'){
      const em = (R.email || '').trim();
      if (em && EMAIL_RE.test(em) && R.consent){ try { await API.rpc('tester_contact', { p_id: TESTER, p_email: em, p_lang: r.lang }); } catch (e) {} }
      await API.rpc('tester_submit', { p_id: TESTER, p_stage: 'finish', p_data: Object.assign({ lang: r.lang, duration: Math.round((Date.now() - R.t0) / 1000) }, r.arm === 'test' ? r.post : {}) });
    }
    R.step = R.step === 'reveal' && r.arm === 'control' ? 'contact' : nextStep;
  } catch (e) {
    if (/bad_state/.test(e.message)){ return loadTester(); }
    R.error = TXL(r.lang).err;
  }
  R.busy = false; render(); window.scrollTo(0, 0);
}
function viewTester(){
  if (S.tstate === 'ok' && S.run) return viewParticipant();
  const msg = S.tstate === 'notfound' ? ['Ce lien n’est pas valide.', 'This link is not valid.', '此連結無效。']
    : S.tstate === 'err' ? ['Connexion impossible. Vérifiez votre connexion Internet.', 'Cannot connect. Please check your internet connection.', '無法連線，請檢查網絡連線。'] : ['Chargement…', 'Loading…', '載入中…'];
  return `<main class="wrap"><section class="card pmain"><h1>Two-Glass Test</h1>${msg.map(m => `<p>${m}</p>`).join('')}${S.tstate === 'err' ? '<button type="button" class="btn lg" data-act="tretry">↻</button>' : ''}</section></main>`;
}

/* ---------- écran QR code (animateur) ---------- */
function sheetHtml(r){
  const ctl = r.arm === 'control';
  const tagFor = s => (!ctl && s === 'T') ? '<span class="tag t">Traité</span>' : '<span class="tag u">Non traité</span>';
  const rows = (codes, samples) => codes.map((c, i) => `<li class="prow">${dot(c, 'sm')}<b>${TX.fr.col[c]}</b><span class="ptxt">${POS[codes.length][i]}</span>${tagFor(samples[i])}</li>`).join('');
  return `<div class="field"><h3>Partie 1</h3><ul class="plist">${rows(r.tri.codes, r.tri.samples)}</ul></div><div class="field"><h3>Partie 2</h3><ul class="plist">${rows(r.pref.codes, r.pref.samples)}</ul></div>`;
}
function viewQR(){
  const R = S.run, r = R.rec, url = testerUrl(r.id), st = R.status || 'assigned';
  const label = { assigned: ['En attente : le testeur scanne le QR code', 'warn'], tri_done: ['Partie 1 envoyée', 'ok'], pref_done: ['Partie 2 envoyée, dernières questions en cours', 'ok'], complete: ['Terminé : réponses enregistrées', 'ok'] }[st] || [st, 'warn'];
  return `

    ${st === 'complete' ? '' : QRLIB(url)}
    <p class="stat"><span class="pulse ${label[1] === 'ok' ? 'ok' : ''}"></span>${label[0]}</p>
    ${st === 'tri_done' ? '<div class="banner alert" role="alert"><b>Servez maintenant les deux verres de la partie 2</b>, puis le testeur continue sur son téléphone.</div>' : ''}
    ${st === 'assigned' ? '<p class="hint">Le testeur ouvre l’appareil photo de son téléphone et vise ce code. Aucune application à installer. Ne montrez pas l’écran de préparation.</p>' : ''}
    <div class="row" style="justify-content:center">
      ${st === 'complete' ? '' : `<button type="button" class="btn ghost" data-act="copyLink" data-u="${esc(url)}">Copier le lien</button>`}
      <button type="button" class="btn" data-act="newRun">${st === 'complete' ? 'Nouvelle dégustation' : 'Terminé, nouvelle dégustation'}</button>

}

function act(name, d){
  const R = S.run, r = R && R.rec;
  switch (name){
    case 'tab': S.tab = d.v; S.csv = null; S.confirmDel = null; S.err = ''; render(); window.scrollTo(0, 0); return;
    case 'cfg': S.cfg[d.k] = d.k === 'share' ? Number(d.v) : d.v; LS.set('tg_cfg', S.cfg); break;
    case 'prepare': return prepare();
    case 'cancelRun': S.run = null; break;
    case 'logout': wipe(); API.logout(); S.auth = null; S.run = null; S.dbRecords = []; S.contacts = []; break;
    case 'newRun': clearInterval(WATCH); S.run = null; S.tab = 'run'; break;
    case 'cancelQR': clearInterval(WATCH); store.del(r.id); S.run = null; S.tab = 'run'; break;
    case 'copyLink': copyText(d.u); return;
    case 'tretry': return loadTester();
    case 'ready': return readyRun();
    case 'next': {
      return testerNext();
    }
    case 'lang': r.lang = d.v; break;
    case 'soft': r.pref.soft = Number(d.v); break;
    case 'consent': R.consent = !R.consent; break;
    case 'curSel': S.flt.cur = d.v; break;
    case 'conv': S.flt.conv = d.v === '1'; break;
    case 'pf': r.profile[d.k] = d.k === 'like' ? Number(d.v) : d.v; break;
    case 'triPick': r.tri.pick = Number(d.v); break;
    case 'conf': r.tri.conf = d.v; break;
    case 'attr': {
      const a = r.tri.attrs;
      if (d.v === 'nsp') r.tri.attrs = a.includes('nsp') ? [] : ['nsp'];
      else { const n = a.filter(x => x !== 'nsp'); r.tri.attrs = n.includes(d.v) ? n.filter(x => x !== d.v) : n.concat(d.v); }
      break;
    }
    case 'prefPick': r.pref.pick = Number(d.v); break;
    case 'strength': r.pref.strength = d.v; break;
    case 'score': r.pref.scores[Number(d.i)] = Number(d.v); break;
    case 'diff': r.pref.diff = d.v; break;
    case 'reuse': r.post.reuse = d.v; break;
    case 'gift': r.post.gift = d.v; break;
    case 'curious': r.post.curious = Number(d.v); break;
    case 'demo': S.demo = d.v === '1'; if (S.demo && !S.demoRecs) S.demoRecs = demoRecords(); break;
    case 'first': S.flt.first = !S.flt.first; break;
    case 'copy': copyText(d.t ? document.getElementById(d.t).textContent : ''); return;
    case 'csv': return exportCsv();
    case 'csvCopy': copyText(toCsv(S.records)); return;
    case 'del': S.confirmDel = d.id; break;
    case 'delNo': S.confirmDel = null; break;
    case 'delYes': store.del(d.id); S.confirmDel = null; toast('Supprimé'); return;
    case 'csvContacts': return exportContacts();
    case 'copyContacts': copyText(toContactsCsv(S.contacts)); return;
  }
  render();
}
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'loginForm') doLogin(); });
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b.dataset); });
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.bind) return;
  setPath(t.dataset.bind, t.type === 'number' ? (t.value === '' ? null : Number(t.value)) : t.value);
  syncNext();
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset || !t.dataset.bind) return;
  setPath(t.dataset.bind, t.type === 'number' ? (t.value === '' ? null : Number(t.value)) : t.value);
  syncNext();
  if (t.dataset.render) render();
});

/* ---------- onglet Résultats ---------- */
function gauge(o, chance, chanceLabel){
  if (o.r == null) return '';
  const p = v => (v * 100).toFixed(1) + '%';
  return `<div class="gauge" role="img" aria-label="Valeur observée ${pc(o.r)}, intervalle de confiance ${pc(o.lo)} à ${pc(o.hi)}, hasard ${pc(chance)}"><div class="g-track"></div><div class="g-chance" style="left:${p(chance)}"><span>${chanceLabel}</span></div><div class="g-ci" style="left:${p(o.lo)};width:${((o.hi - o.lo) * 100).toFixed(1)}%"></div><div class="g-dot" style="left:${p(o.r)}"></div></div><div class="g-axis"><span>0 %</span><span>50 %</span><span>100 %</span></div>`;
}
const vtag = (v, p) => `<span class="tag ${v.tone}">${v.label}</span>${p != null ? ` <span class="sub">${fmtP(p)}</span>` : ''}`;
function rateCell(o){ return o.n ? `${pc(o.r)} <span class="sub">${o.k}/${o.n}</span>` : '–'; }
function groupTable(rows, first){
  if (!rows.length) return '<p class="hint">Aucune donnée.</p>';
  return `<div class="tw"><table><thead><tr><th>${first}</th><th class="r">Tests</th><th>Détection</th><th>Préférence (traité)</th><th class="r">Prix médian</th></tr></thead><tbody>${rows.map(g => `<tr class="${g.n < 10 ? 'faint' : ''}"><td>${esc(g.label)}${g.n && g.n < 10 ? ' <span class="sub">indicatif</span>' : ''}</td><td class="r num">${g.n}</td><td class="num">${rateCell(g.det)}</td><td class="num">${rateCell(g.pref)}</td><td class="r num">${eur(g.wtp)}</td></tr>`).join('')}</tbody></table></div>`;
}
function sentences(a){
  const out = [], d = a.det.T, p = a.pref.T;
  if (d.n) out.push(`Lors d’un test triangulaire en aveugle réalisé sur ${d.n} dégustations, ${d.k} personnes (${pc(d.r)}) ont identifié le verre différent, contre ${pc(1 / 3)} attendus par hasard (IC 95 % : ${pc(d.lo)} à ${pc(d.hi)} ; ${fmtP(d.p)}). ${d.p < 0.05 ? 'Ce résultat est statistiquement supérieur au hasard.' : 'Ce résultat n’est pas statistiquement supérieur au hasard.'}`);
  if (p.n) out.push(`Dans un test de préférence en aveugle (${p.n} dégustations), ${pc(p.r)} des participants ont préféré le verre traité (IC 95 % : ${pc(p.lo)} à ${pc(p.hi)} ; ${fmtP(p.p)}). ${p.p < 0.05 ? 'L’écart avec une répartition au hasard (50 %) est significatif.' : 'L’écart avec une répartition au hasard (50 %) n’est pas significatif.'}`);
  const sf = a.soft.T;
  if (sf.n) out.push(`Dans le même test en aveugle (${sf.n} dégustations), ${pc(sf.r)} des participants ont jugé le verre traité plus doux et moins agressif en bouche (IC 95 % : ${pc(sf.lo)} à ${pc(sf.hi)} ; ${fmtP(sf.p)}). ${sf.p < 0.05 ? 'L’écart avec une répartition au hasard (50 %) est significatif.' : 'L’écart avec une répartition au hasard (50 %) n’est pas significatif.'}`);
  if (a.det.C.n >= 5) out.push(`Dans les séries témoin, où aucun verre n’était traité (${a.det.C.n} dégustations), ${pc(a.det.C.r)} des participants ont désigné le « verre différent » et ${pc(a.claim.C.r)} ont déclaré percevoir une différence, contre ${pc(a.claim.T.r)} dans les séries test.`);
  return out;
}

  const sT = a.soft.T, vSoft = verdict(sT.p, sT.n);
  kpi.push(`<div class="kpi"><span class="k-l">Douceur perçue · verre traité</span>

  /* contrôle de la méthode */
  let ctl;
  if (!a.nC){

      ${row('Préférence pour le verre « traité » (témoins)', '50 %', pCt.n ? rateCell(pCt) : '–', pCt.p != null && pCt.p < 0.05 ? 'Biais de position ou de service' : 'Cohérent avec le hasard', pCt.p != null && pCt.p < 0.05 ? 'bad' : 'ok')}
      ${row('Verre « traité » jugé le plus doux (témoins)', '50 %', a.soft.C.n ? rateCell(a.soft.C) : '–', a.soft.C.p != null && a.soft.C.p < 0.05 ? 'Biais de position ou de service' : 'Cohérent avec le hasard', a.soft.C.p != null && a.soft.C.p < 0.05 ? 'bad' : 'ok')}
      ${row('Différence perçue : tests contre témoins', 'Test > témoin', `${pc(a.claim.T.r)} contre ${pc(a.claim.C.r)}`, a.claimDiff != null && a.claimDiff < 0.05 && a.claim.T.r > a.claim.C.r ? 'Dépasse la suggestion (' + fmtP(a.claimDiff) + ')' : 'Pas de différence nette avec la suggestion (' + fmtP(a.claimDiff) + ')', a.claimDiff != null && a.claimDiff < 0.05 && a.claim.T.r > a.claim.C.r ? 'ok' : 'neutral')}
      ${row('Détection : tests contre témoins', 'Test > témoin', `${pc(a.det.T.r)} contre ${pc(dC.r)}`, a.detDiff != null && a.detDiff < 0.05 && a.det.T.r > dC.r ? 'Dépasse la suggestion (' + fmtP(a.detDiff) + ')' : 'Pas de différence nette avec les témoins (' + fmtP(a.detDiff) + ')', a.detDiff != null && a.detDiff < 0.05 && a.det.T.r > dC.r ? 'ok' : 'neutral')}

    </tbody></table></div>

  const attrs = a.attrs.list.filter(x => x.k > 0).sort((x, y) => y.k - x.k);
  const attrHtml = a.attrs.nDet && attrs.length ? `<div class="bars">${attrs.map(x => `<div class="bar-r"><span>${esc(x.label)}</span><span class="tr"><i style="width:${Math.round(x.share * 100)}%"></i></span><span class="v">${pc(x.share)}</span></div>`).join('')}</div><p class="hint">Part des ${a.attrs.nDet} participants qui ont désigné le bon verre et cité cet élément.</p>` : '<p class="hint">Aucun participant n’a encore désigné le bon verre.</p>';

  <section class="card">
    <div><h1>Résultats</h1>
    <p class="lead" style="margin-top:8px"><b class="num">${a.n}</b> dégustations terminées, <b class="num">${a.participants}</b> participants. <span class="sub">${a.nT} séries test, ${a.nC} séries témoin. Les indicateurs ci-dessous portent sur les séries test.</span></p></div>
    ${toggle}${filters}
  </section>
  <section class="grid2" aria-label="Indicateurs principaux">${kpi.join('')}</section>

  <section class="blk"><h2>Par profil</h2>${groupTable(a.bySeg.filter(g => g.n), 'Profil')}</section>

  <section class="blk"><h2>Prix : part des testeurs prêts à payer au moins…</h2>${ladder}
    ${a.gift.n ? `<p class="sub" style="font-size:13.5px">Tentés de l’offrir : ${pc(a.gift.yes.r)} « oui », ${a.gift.dist.maybe} « peut-être » sur ${a.gift.n}. Envie de goûter d’autres vins (4 ou 5 sur 5) : ${pc(a.curious.top2.r)}${a.curious.non.n ? `, dont ${pc(a.curious.non.r)} chez ceux qui n’aiment pas le vin (${a.curious.non.k}/${a.curious.non.n})` : ''}.</p>` : ''}</section>
  <section class="blk"><h2>Phrases prêtes à citer</h2>${sentHtml}<p class="hint">Citez toujours l’effectif et la méthode (test interne, en aveugle). N’annoncez rien que ces chiffres ne montrent pas.</p></section>`;

/* ---------- onglet Protocole ---------- */
function viewProto(){
  const t = [0.2, 0.3, 0.4].map(x => [x, needTri(x)]), f = [0.6, 0.65, 0.7].map(x => [x, needPref(x)]);
  return `
  <section class="card"><h1>Protocole</h1><p class="lead">Ce que mesure chaque partie, et comment organiser une session pour que les chiffres résistent à un sceptique.</p></section>
  <section class="blk"><h2>Ce que mesure chaque partie</h2>
    <h3>Partie 1 · test triangulaire</h3>
    <p>Trois verres, dont deux identiques. Le participant désigne celui qui diffère. Au hasard, 1 personne sur 3 a juste. Si nettement plus de 1 sur 3 trouvent le bon verre, la différence est perceptible. On mesure le <b>taux de détection</b>.</p>
    <h3>Partie 2 · préférence</h3>
    <p>Deux verres, l’un traité, l’autre non. Le participant choisit celui qu’il préfère, note chaque verre de 1 à 7 et dit s’il perçoit une différence. Au hasard, 1 personne sur 2 choisit le verre traité. On mesure le <b>taux de préférence</b>.</p>
    <h3>Douceur perçue</h3>
    <p>Après avoir donné sa préférence, le participant dit quel verre lui semble le plus doux, le moins agressif (moins de chaleur de l’alcool). C’est un choix forcé entre deux verres, comparé au hasard (50 %) puis aux séries témoin. Cette question est posée en dernier pour ne pas orienter la préférence. Le mot « plus doux » n’apparaît jamais avant.</p>
    <h3>Séries témoin</h3>
    <p>Dans 1 série sur 5 environ, aucun verre n’est traité et le participant ne le sait pas. On voit alors combien de personnes « sentent » une différence qui n’existe pas. Sans témoin, un bon score peut s’expliquer par la seule suggestion.</p>
    <h3>Après la révélation</h3>
    <p>Le participant dit s’il réutiliserait le dispositif, combien il paierait, s’il l’offrirait. On mesure la <b>réutilisation envisagée</b> et la <b>disposition à payer</b>. Ces réponses sont déclaratives, jamais des ventes.</p></section>
  <section class="blk"><h2>Ce que le test dit du mécanisme</h2>
    <p>Le test mesure ce que les gens <b>perçoivent</b> : une différence, une préférence, une impression de douceur. Il ne prouve pas que le dispositif modifie la composition du vin. Pour affirmer qu’il agit sur des molécules d’alcool, il faudrait une analyse chimique indépendante (laboratoire accrédité, vin traité contre vin non traité, plusieurs répétitions). Tant qu’elle n’existe pas, formulez l’effet comme une perception mesurée en aveugle, par exemple « jugé plus doux en bouche par X % des testeurs ».</p>
    <p>À Hong Kong comme en France ou dans l’Union européenne, une allégation sur l’effet du produit doit pouvoir être justifiée. Vérifiez le libellé exact avec un conseil local avant toute communication commerciale.</p></section>
  <section class="blk"><h2>Langues, prix et e-mails</h2>
    <p>Le questionnaire du participant existe en français, anglais et chinois traditionnel (Hong Kong). La langue est choisie par l’animateur et modifiable par le participant. Les résultats restent en français pour l’animateur. Un texte libre (commentaire) est conservé dans la langue de saisie.</p>
    <p>Le prix est demandé dans la devise choisie pour la session (€, HK$, US$, £) et analysé devise par devise. L’adresse e-mail est facultative, avec une case de consentement distincte. Elle est enregistrée à part, sans lien avec les réponses du test, et exportée dans son propre fichier (onglet Données). Indiquez aux participants qui est le responsable du traitement, et supprimez l’adresse sur simple demande.</p></section>
  <section class="blk"><h2>Sur le terrain, avec les téléphones</h2>
    <ul class="checks">
      <li>L’animateur prépare les verres sur son téléphone, puis touche « C’est prêt » : un QR code s’affiche.</li>
      <li>Le testeur le scanne avec l’appareil photo de son téléphone. Il remplit son questionnaire dans sa langue. Rien à installer.</li>
      <li>Quand il a validé la partie 1, l’écran de l’animateur indique de servir les deux verres de la partie 2.</li>
      <li>Le testeur ne reçoit jamais la composition des verres avant d’avoir envoyé sa préférence : elle est gardée côté serveur.</li>
      <li>Un testeur qui perd sa connexion peut rouvrir le même lien et reprendre là où il s’était arrêté.</li>
    </ul></section>
  <section class="blk"><h2>Avant la session</h2>
    <ul class="checks">
      <li>Une seule bouteille, du même lot, pour tous les verres d’un vin. Même température de service.</li>
      <li>Verres identiques, propres, même volume. Si possible opaques ou foncés, pour masquer toute différence de couleur ou de limpidité.</li>
      <li>Le dispositif est appliqué hors de vue du participant. Sur les verres non traités, faites le même geste avec un liège neutre, identique d’aspect mais sans la technologie : le test compare alors la technologie, pas la présence d’un bouchon.</li>
      <li>Collez sous le pied de chaque verre une pastille de la couleur indiquée sur la fiche (vert, jaune, rouge, orange, bleu), en cachant le geste au testeur. Les couleurs sont tirées au sort pour chaque dégustation, comme l’ordre.</li>
      <li>Servez sans commentaire, sans sourire entendu. Aucun échange entre participants avant la fin des réponses.</li>
      <li>De l’eau et un peu de pain neutre entre les parties. Les verres de la partie 2 ne sont servis qu’après la partie 1.</li>
      <li>Notez les conditions dans le nom de session (lieu, jour, vin). Réservé aux personnes majeures. Aucun nom n’est collecté.</li>
    </ul></section>
  <section class="blk"><h2>Combien de dégustations prévoir</h2>
    <p>Plus l’effet réel est petit, plus il faut de monde pour le distinguer du hasard. Calcul exact, seuil de 5 %, probabilité de détecter l’effet s’il existe : 80 %. Ces effectifs concernent les séries test, sans compter les témoins.</p>
    <div class="tw"><table><thead><tr><th>Mesure</th><th>Si la vraie valeur est…</th><th class="r">Dégustations test</th></tr></thead><tbody>
      ${t.map(([x, n]) => `<tr><td>Détection</td><td>${Math.round(x * 100)} % de personnes qui perçoivent vraiment une différence</td><td class="r num">${n || '> 400'}</td></tr>`).join('')}
      ${f.map(([x, n]) => `<tr><td>Préférence</td><td>${Math.round(x * 100)} % préfèrent le verre traité</td><td class="r num">${n || '> 400'}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="hint">Sous 30 dégustations test, un résultat reste fragile. Pour comparer les profils (sommeliers, amateurs, non-consommateurs) ou les types de vin, prévoyez ces effectifs pour chaque groupe.</p></section>
  <section class="blk"><h2>Lire les résultats</h2>
    <p><b>Intervalle de confiance à 95 %</b> : la fourchette dans laquelle se trouve probablement la vraie valeur. Si elle exclut la valeur du hasard (trait pointillé), le résultat est solide.</p>
    <p><b>p</b> : la probabilité d’obtenir un résultat aussi marqué si seul le hasard jouait. Sous 0,05, on parle de résultat significatif.</p>
    <p><b>Une dégustation par participant</b> : si une même personne goûte plusieurs vins, ses réponses ne sont pas indépendantes. Ce filtre ne garde que sa première dégustation.</p></section>
  <section class="blk"><h2>Ce que vous pourrez affirmer</h2>
    <ul class="checks"><li>« ${'X'} % de ${'N'} testeurs ont identifié le verre différent lors d’un test en aveugle, contre 33 % attendus par hasard. »</li>
    <li>Ce que les séries témoin montrent de l’effet de suggestion, avec leurs effectifs.</li></ul>
    <ul class="checks no"><li>« Scientifiquement prouvé », tant qu’aucune étude indépendante n’est publiée.</li>
    <li>Toute promesse sur la santé, ou une explication du mécanisme que vous ne maîtrisez pas.</li></ul></section>`;
}

/* ---------- onglet Données ---------- */
function viewData(){
  const recs = S.records.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const st = { complete: ['ok', 'Terminée'], assigned: ['warn', 'Non terminée'] };
  return `
  <section class="card"><h1>Données des tests</h1>
    <p class="lead">${recs.length} dégustation${recs.length > 1 ? 's' : ''} enregistrée${recs.length > 1 ? 's' : ''}. Le CSV contient toutes les réponses brutes, ouvrable dans Excel.</p>
    <div class="row"><button type="button" class="btn" data-act="csv" ${recs.length ? '' : 'disabled'}>Exporter en CSV</button><button type="button" class="btn ghost" data-act="csvCopy" ${recs.length ? '' : 'disabled'}>Copier le CSV</button></div>
    ${S.csv ? `<div class="field"><label for="f-csv">CSV</label><textarea id="f-csv" readonly style="min-height:160px;font-family:var(--f-mono);font-size:12px">${esc(S.csv)}</textarea></div>` : ''}
  </section>
  <section class="card"><h2>Contacts e-mail</h2>
    <p class="lead">${S.contacts.length} adresse${S.contacts.length > 1 ? 's' : ''} avec consentement. Elles ne sont pas rattachées aux réponses des tests.</p>
    <div class="row"><button type="button" class="btn" data-act="csvContacts" ${S.contacts.length ? '' : 'disabled'}>Exporter les contacts</button><button type="button" class="btn ghost" data-act="copyContacts" ${S.contacts.length ? '' : 'disabled'}>Copier</button></div>
    ${S.contacts.length ? `<div class="tw"><table><thead><tr><th>E-mail</th><th>Langue</th><th>Session</th><th></th></tr></thead><tbody>${S.contacts.map(c => `<tr><td>${esc(c.email)}</td><td>${esc(c.lang)}</td><td>${esc(c.session)}</td><td>${S.confirmDel === c.id ? `<button type="button" class="btn" data-act="delYes" data-id="${esc(c.id)}">Confirmer</button> <button type="button" class="btn quiet" data-act="delNo">Non</button>` : `<button type="button" class="btn quiet" data-act="del" data-id="${esc(c.id)}">Supprimer</button>`}</td></tr>`).join('')}</tbody></table></div>` : ''}
  </section>
  ${recs.length ? `<div class="tw"><table><thead><tr><th>Participant</th><th>Session</th><th>Vin</th><th>Série</th><th>Détection</th><th>Préféré</th><th class="r">Prix</th><th>État</th><th></th></tr></thead><tbody>
  ${recs.map(r => {
    const s = st[r.status] || ['neutral', r.status];
    const det = r.tri && r.tri.pick != null ? (triCorrect(r) ? 'Juste' : 'Faux') : '–';
    const pf = r.pref && r.pref.pick != null ? (prefPickedT(r) ? 'Traité' : 'Non traité') : '–';
    return `<tr><td><b>${esc(r.pid)}</b>${r.round > 1 ? ` <span class="sub">vin ${r.round}</span>` : ''}</td><td>${esc(r.session)}</td><td>${esc(r.wine && r.wine.name)}<br><span class="sub">${esc(r.wine && r.wine.type)}</span></td><td>${r.arm === 'control' ? 'Témoin' : 'Test'}</td><td>${det}</td><td>${pf}</td><td class="r num">${r.post && typeof r.post.wtp === 'number' ? money(r.post.wtp, curOf(r)) : '–'}</td><td><span class="tag ${s[0]}">${s[1]}</span></td>
      <td>${S.confirmDel === r.id ? `<button type="button" class="btn" data-act="delYes" data-id="${esc(r.id)}">Confirmer</button> <button type="button" class="btn quiet" data-act="delNo">Non</button>` : `<button type="button" class="btn quiet" data-act="del" data-id="${esc(r.id)}" aria-label="Supprimer ${esc(r.pid)}">Supprimer</button>`}</td></tr>`;
  }).join('')}</tbody></table></div>` : '<p class="hint">Rien à afficher pour l’instant.</p>'}`;
}

/* ---------- démarrage ---------- */
async function boot(){
  if (TESTER){ if (!CONFIGURED){ S.tstate = 'err'; render(); return; } return loadTester(); }
  if (CONFIGURED && API.auth){ try { await API.ensureFresh(); S.auth = API.auth; } catch (e) { S.auth = null; } }
  render();
  if (S.auth) store.init();
}
boot();
</script>
